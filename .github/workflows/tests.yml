name: QA Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  automated-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Crear carpetas de reportes
        run: mkdir -p reports/screenshots

      - name: Ejecutar pruebas Pytest
        run: python -m pytest -s

      - name: Ejecutar pruebas Behave
        if: always()
        run: |
          python -m behave features/login.feature \
            --format json \
            --outfile reports/behave-report.json

      - name: Guardar reportes como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-automation-reports
          path: |
            reports/
          if-no-files-found: warn
          retention-days: 30
